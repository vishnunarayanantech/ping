<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PING</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body data-page-title="PING">

  <!-- Persistent "you're on a call" bar — shown only once a call is actually
       connecting/connected (see calls.js's render()). Deliberately NOT part
       of #callOverlay's full-screen backdrop: once a call is under way, the
       task requires the chat (message list AND composer) to stay fully
       usable underneath/around it, unlike the ringing/incoming states below
       which DO block interaction like a normal modal. Fixed at the very top
       so it survives switching conversations or closing the chat entirely
       (the call keeps running independent of whatever chat view is open) —
       #appShell gets padding-top added (app-shell--call-bar) whenever this
       is visible so it never covers the sidebar/chat header underneath. -->
  <div class="active-call-bar" id="activeCallBar" hidden>
    <span class="avatar avatar--sm" id="activeCallBarAvatar"></span>
    <span class="active-call-bar__info">
      <span class="active-call-bar__name" id="activeCallBarName"></span>
      <span class="active-call-bar__status" id="activeCallBarStatus"></span>
    </span>
    <!-- Audio calls only (see calls.js's renderActiveBar/renderScreenShareButton)
         — shown while this side is sharing its screen, as an explicit "you
         are sharing" cue that doesn't depend on noticing the tiny local
         preview thumbnail in #callVideoPanel. -->
    <span class="active-call-bar__sharing-badge" id="activeCallSharingBadge" hidden>Sharing your screen</span>
    <button type="button" class="icon-btn active-call-bar__mute" id="activeCallMuteBtn" aria-label="Mute microphone" title="Mute">
      <i data-lucide="mic" aria-hidden="true"></i>
    </button>
    <!-- Video calls only (see calls.js's renderActiveBar) — hidden entirely
         for an audio call so that call's bar is pixel-identical to before. -->
    <button type="button" class="icon-btn active-call-bar__camera" id="activeCallCameraBtn" aria-label="Turn off camera" title="Turn off camera" hidden>
      <i data-lucide="video" aria-hidden="true"></i>
    </button>
    <!-- Audio calls only (see calls.js's renderScreenShareButton) — the
         camera button above is video-call-only and this one is
         audio-call-only, so exactly one of the two ever shows at a time.
         Feature C is audio+screen only (no camera track involved) — see
         calls.js's toggleScreenShare. -->
    <button type="button" class="icon-btn active-call-bar__screen-share" id="activeCallScreenShareBtn" aria-label="Share your screen" title="Share Screen" hidden>
      <i data-lucide="screen-share" aria-hidden="true"></i>
    </button>
    <button type="button" class="call-btn call-btn--end active-call-bar__end" id="activeCallEndBtn" aria-label="End call" title="End call">
      <i data-lucide="phone-off" aria-hidden="true"></i>
    </button>
  </div>

  <!-- Group audio calling (see groupcalls.js) — entirely separate DOM/state
       from #activeCallBar above: a 1:1 call and a group call can't be
       active at the same time (see Calls.isActive/GroupCalls.isActive), but
       keeping them as two distinct bars/overlays (rather than teaching the
       1:1 ones to also handle N participants) keeps the well-tested 1:1
       call code completely untouched. -->

  <!-- Incoming group-call invitation — a slim, non-blocking banner (not a
       full-screen overlay like #callOverlay) since joining is optional and
       the task calls for minimal interference with normal chat use. Stays
       up (at idle poll speed) until the invitee joins, dismisses it, or the
       call ends. -->
  <div class="group-call-banner" id="groupCallBanner" hidden>
    <span class="avatar avatar--sm" id="groupCallBannerAvatar"></span>
    <span class="group-call-banner__text">
      <strong id="groupCallBannerCreator"></strong> started a group call
    </span>
    <button type="button" class="btn btn--secondary" id="groupCallDismissBtn">Dismiss</button>
    <button type="button" class="btn btn--primary" id="groupCallJoinBtn">Join</button>
  </div>

  <!-- Active group call — the compact bar (mirrors #activeCallBar's role)
       plus its collapsible participant list panel. Visible for as long as
       this user is joined, independent of which conversation is open. -->
  <div class="group-call-bar" id="groupCallBar" hidden>
    <i data-lucide="users" class="group-call-bar__icon" aria-hidden="true"></i>
    <span class="group-call-bar__info">
      <span class="group-call-bar__title">Group call</span>
      <span class="group-call-bar__count" id="groupCallBarCount"></span>
    </span>
    <button type="button" class="icon-btn group-call-bar__mute" id="groupCallMuteBtn" aria-label="Mute microphone" title="Mute">
      <i data-lucide="mic" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn group-call-bar__people" id="groupCallPeopleBtn" aria-label="Show participants" title="Participants">
      <i data-lucide="users" aria-hidden="true"></i>
    </button>
    <!-- Creator only — see groupcalls.js's renderBar. Anyone (including the
         creator) can also just leave without ending it for everyone. -->
    <button type="button" class="btn btn--secondary group-call-bar__end" id="groupCallEndBtn" hidden>End for all</button>
    <button type="button" class="call-btn call-btn--end group-call-bar__leave" id="groupCallLeaveBtn" aria-label="Leave call" title="Leave call">
      <i data-lucide="phone-off" aria-hidden="true"></i>
    </button>
  </div>

  <div class="group-call-panel" id="groupCallPanel" hidden>
    <div class="group-call-panel__header">
      <span>Participants</span>
      <button type="button" class="icon-btn" id="groupCallPanelClose" aria-label="Close participants">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
    </div>
    <div class="group-call-panel__list" id="groupCallParticipantList"></div>
  </div>

  <!-- One <audio autoplay> per remote participant, created/removed by
       groupcalls.js as peers join/leave — unlike #callRemoteAudio (a single
       fixed element for the one 1:1 remote party), a group call's peer
       count is variable, so these can't be static markup. -->
  <div id="groupCallAudioContainer" hidden></div>

  <!-- Floating video panel: remote video primary, local video PIP. Only
       relevant for video calls, and only once the call is actually
       connecting/connected (see calls.js's renderVideoPanel) — the
       ring-out/incoming states use #callOverlay below instead, same split
       #activeCallBar already uses for audio. Deliberately its own floating
       element rather than living inside #activeCallBar (52px tall, no room
       for video) or #appShell (must float above the chat, non-blocking, and
       survive switching conversations same as #activeCallBar does). -->
  <div class="call-video-panel" id="callVideoPanel" hidden>
    <div class="call-video-panel__remote-wrap">
      <video class="call-video-panel__remote" id="callRemoteVideo" autoplay playsinline></video>
      <div class="call-video-panel__placeholder" id="callRemotePlaceholder">
        <span class="avatar avatar--lg" id="callVideoPanelAvatar"></span>
      </div>
      <!-- Remote screen-share viewer only (see calls.js's renderVideoPanel) —
           never shown for a plain video call or for this side's own local
           screen-share preview. Toggles call-video-panel--expanded; icon/
           label swap between the two states in calls.js. -->
      <button type="button" class="icon-btn call-video-panel__expand-btn" id="callScreenExpandBtn" aria-label="Expand screen" title="Expand screen" hidden>
        <i data-lucide="maximize-2" aria-hidden="true"></i>
      </button>
    </div>
    <div class="call-video-panel__local-wrap" id="callLocalWrap">
      <video class="call-video-panel__local" id="callLocalVideo" autoplay muted playsinline></video>
      <div class="call-video-panel__placeholder call-video-panel__placeholder--local" id="callLocalPlaceholder" hidden>
        <i data-lucide="video-off" aria-hidden="true"></i>
      </div>
    </div>
  </div>

  <div class="app-shell" id="appShell">

    <!-- Sidebar: search + current user -->
    <aside class="app-sidebar">
      <div class="app-sidebar__header">
        <a class="app-header__brand" href="index.html">
          <img src="../assets/images/logo.svg" alt="">
          <span data-app-name>PING</span>
        </a>
        <button type="button" class="icon-btn theme-toggle" aria-label="Toggle dark mode">
          <i data-lucide="sun" class="icon-sun" aria-hidden="true"></i>
          <i data-lucide="moon" class="icon-moon" aria-hidden="true"></i>
        </button>
      </div>

      <div class="app-sidebar__search">
        <div class="search-input">
          <i data-lucide="search" class="search-input__icon" aria-hidden="true"></i>
          <label for="userSearchInput" class="visually-hidden">Search people</label>
          <input type="text" id="userSearchInput" placeholder="Search people..." autocomplete="off">
        </div>
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <div class="app-sidebar__conversations">
        <span class="sidebar-section-label">Recent Chats</span>
        <div class="conversation-list" id="conversationList"></div>
      </div>

      <div class="app-sidebar__footer">
        <a class="sidebar-user" id="sidebarUserLink" href="../profile/profile.html" title="View profile">
          <span class="avatar avatar--sm" id="sidebarUserInitials"></span>
          <span class="sidebar-user__info">
            <span class="sidebar-user__name" id="sidebarUserName"></span>
            <span class="sidebar-user__email" id="sidebarUserEmail"></span>
          </span>
        </a>
        <button type="button" class="icon-btn" id="logoutBtn" aria-label="Logout" title="Logout">
          <i data-lucide="log-out" aria-hidden="true"></i>
        </button>
      </div>
    </aside>

    <!-- Chat area -->
    <main class="app-chat">

      <!-- Empty state: no conversation selected -->
      <div class="chat-empty" id="chatEmpty">
        <div class="chat-empty__icon">
          <i data-lucide="message-circle" aria-hidden="true"></i>
        </div>
        <h1>Welcome to <span data-app-name>PING</span></h1>
        <p>Search for a colleague to start a conversation.</p>
      </div>

      <!-- Active conversation -->
      <div class="chat-conversation" id="chatConversation" hidden>
        <header class="chat-header">
          <button type="button" class="chat-header__back" id="chatBackBtn" aria-label="Back to chats">
            <i data-lucide="arrow-left" aria-hidden="true"></i>
            <span class="chat-header__back-label">Chats</span>
          </button>
          <span class="avatar avatar--sm" id="chatHeaderInitials"></span>
          <span class="chat-header__name" id="chatHeaderName"></span>
          <button type="button" class="icon-btn chat-header__call-btn" id="callBtn" aria-label="Start audio call" title="Audio call">
            <i data-lucide="phone" aria-hidden="true"></i>
          </button>
          <button type="button" class="icon-btn chat-header__call-btn" id="videoCallBtn" aria-label="Start video call" title="Video call">
            <i data-lucide="video" aria-hidden="true"></i>
          </button>
          <button type="button" class="icon-btn chat-header__call-btn" id="groupCallBtn" aria-label="Start group call" title="Group call">
            <i data-lucide="users" aria-hidden="true"></i>
          </button>
        </header>

        <div class="chat-messages" id="chatMessages" aria-live="polite"></div>

        <div class="reply-preview" id="replyPreview" hidden>
          <span class="reply-preview__bar" aria-hidden="true"></span>
          <div class="reply-preview__body">
            <span class="reply-preview__sender" id="replyPreviewSender"></span>
            <span class="reply-preview__content" id="replyPreviewContent"></span>
          </div>
          <button type="button" class="reply-preview__close" id="replyPreviewClose" aria-label="Cancel reply">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="upload-progress" id="uploadProgress" hidden>
          <i data-lucide="file-up" class="upload-progress__icon" aria-hidden="true"></i>
          <div class="upload-progress__body">
            <span class="upload-progress__name" id="uploadProgressName"></span>
            <div class="upload-progress__track">
              <div class="upload-progress__fill" id="uploadProgressFill"></div>
            </div>
          </div>
        </div>

        <form class="chat-input-bar" id="messageForm" novalidate>
          <label for="fileInput" class="visually-hidden">Attach a file</label>
          <input type="file" id="fileInput" hidden>
          <button type="button" class="icon-btn chat-file-btn" id="fileUploadBtn" aria-label="Attach file" title="Attach file">
            <i data-lucide="paperclip" aria-hidden="true"></i>
          </button>
          <label for="messageInput" class="visually-hidden">Message</label>
          <input type="text" id="messageInput" name="message" placeholder="Type a message..." autocomplete="off" maxlength="5000">
          <button type="submit" class="btn btn--primary chat-send-btn" id="sendBtn" disabled aria-label="Send message">
            <i data-lucide="send" aria-hidden="true"></i>
          </button>
        </form>
      </div>

    </main>
  </div>

  <!-- Forward-message modal: conversation picker + preview, opened from a
       message row's Forward action (see chat.js / forward.js). -->
  <div class="modal-overlay" id="forwardModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="forwardModalTitle">
      <header class="modal__header">
        <h2 class="modal__title" id="forwardModalTitle">Forward message</h2>
        <button type="button" class="icon-btn modal__close" id="forwardModalClose" aria-label="Close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>

      <div class="forward-modal__preview">
        <span class="forward-modal__preview-label">Forwarding</span>
        <div class="forward-quote">
          <span class="forward-quote__sender" id="forwardPreviewSender"></span>
          <span class="forward-quote__content" id="forwardPreviewContent"></span>
        </div>
      </div>

      <div class="forward-modal__list" id="forwardConversationList"></div>

      <footer class="modal__footer">
        <button type="button" class="btn btn--secondary" id="forwardCancelBtn">Cancel</button>
        <button type="button" class="btn btn--primary" id="forwardConfirmBtn" disabled>Forward</button>
      </footer>
    </div>
  </div>

  <!-- Start-group-call modal: picks WHO beyond the current chat partner
       (always included automatically — see groupcalls.js) to invite, from
       the creator's own existing conversations. Same modal-overlay/modal
       structure as the forward-message modal above. -->
  <div class="modal-overlay" id="groupCallStartModalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="groupCallStartModalTitle">
      <header class="modal__header">
        <h2 class="modal__title" id="groupCallStartModalTitle">Start group call</h2>
        <button type="button" class="icon-btn modal__close" id="groupCallStartModalClose" aria-label="Close">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>

      <p class="group-call-modal__hint" id="groupCallStartModalHint"></p>

      <div class="group-call-modal__list" id="groupCallContactList"></div>

      <footer class="modal__footer">
        <button type="button" class="btn btn--secondary" id="groupCallStartCancelBtn">Cancel</button>
        <button type="button" class="btn btn--primary" id="groupCallStartConfirmBtn">Start Call</button>
      </footer>
    </div>
  </div>

  <!-- Image lightbox: opened by clicking an inline image preview (see
       chat.js / media.js). Just an enlarged view of the same already-
       fetched image — never triggers a download. -->
  <div class="lightbox-overlay" id="imageLightboxOverlay" hidden>
    <button type="button" class="icon-btn lightbox__close" id="imageLightboxClose" aria-label="Close">
      <i data-lucide="x" aria-hidden="true"></i>
    </button>
    <img class="lightbox__image" id="imageLightboxImg" alt="">
  </div>

  <!-- Audio/video call overlay: the full-screen, blocking panel for the
       states that need a decision or are just a brief notice — outgoing
       (calling), incoming, and the transient declined/missed/busy/failed/
       ended messages (see calls.js's render()/STATUS_TEXT). Modeled on the
       SAME overlay/modal architecture as the forward-message modal and image
       lightbox above.

       Deliberately does NOT cover the "connecting"/"connected" states —
       once a call is actually under way, #activeCallBar/#callVideoPanel
       (above, outside #appShell) take over instead, precisely so the chat
       stays usable while a call is in progress (task requirement: send a
       message while a call is active). Only one of the two is ever visible
       at a time. -->
  <div class="call-overlay" id="callOverlay" hidden>
    <div class="call-panel">
      <span class="avatar avatar--lg" id="callAvatar"></span>
      <!-- Outgoing video calls only: the caller's own camera feed, shown the
           moment permission is granted (task requirement) — never shown for
           "incoming" since the receiver's camera isn't touched before they
           accept (see calls.js's acceptCall). Swaps in for the avatar above
           rather than sitting alongside it. -->
      <video class="call-panel__preview-video" id="callPreviewVideo" autoplay muted playsinline hidden></video>
      <h2 class="call-panel__name" id="callName"></h2>
      <p class="call-panel__type" id="callTypeLabel" hidden>
        <i data-lucide="video" aria-hidden="true"></i> Video call
      </p>
      <p class="call-panel__status" id="callStatusText">Calling…</p>

      <div class="call-panel__actions" id="callActionsOutgoing" hidden>
        <button type="button" class="call-btn call-btn--end" id="callCancelBtn" aria-label="Cancel call" title="Cancel">
          <i data-lucide="phone-off" aria-hidden="true"></i>
        </button>
      </div>

      <div class="call-panel__actions" id="callActionsIncoming" hidden>
        <button type="button" class="call-btn call-btn--end" id="callRejectBtn" aria-label="Reject call" title="Reject">
          <i data-lucide="phone-off" aria-hidden="true"></i>
        </button>
        <button type="button" class="call-btn call-btn--accept" id="callAcceptBtn" aria-label="Accept call" title="Accept">
          <i data-lucide="phone" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Remote-only audio (see calls.js's docstring on why local mic audio is
       never attached to any <audio> element — that would be feedback). Kept
       outside both call UIs above since it has no visual presence of its
       own and must keep playing regardless of which one (if either) is
       currently shown. -->
  <audio id="callRemoteAudio" autoplay></audio>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/avatars.js"></script>
  <script src="../assets/js/users.js"></script>
  <script src="../assets/js/conversations.js"></script>
  <script src="../assets/js/forward.js"></script>
  <script src="../assets/js/upload.js"></script>
  <script src="../assets/js/media.js"></script>
  <script src="../assets/js/calls.js"></script>
  <script src="../assets/js/groupcalls.js"></script>
  <script src="../assets/js/chat.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
