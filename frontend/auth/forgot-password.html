<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password &mdash; ping</title>
  <link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="auth-page" data-page-title="Forgot password">

  <button type="button" class="icon-btn theme-toggle page-theme-toggle" aria-label="Toggle dark mode">
    <i data-lucide="sun" class="icon-sun" aria-hidden="true"></i>
    <i data-lucide="moon" class="icon-moon" aria-hidden="true"></i>
  </button>

  <div class="standalone-layout">

    <a class="standalone-back" href="login.html">
      <i data-lucide="arrow-left" aria-hidden="true"></i>
      Back to login
    </a>

    <div class="standalone-brand">
      <img src="../assets/images/logo.svg" alt="">
      <span data-app-name>ping</span>
    </div>

    <div class="card auth-card">

      <!-- Form state -->
      <div class="auth-card__state is-active" id="formState">
        <div class="auth-card__icon">
          <i data-lucide="mail" aria-hidden="true"></i>
        </div>
        <h1>Forgot your password?</h1>
        <p class="auth-card__description">
          Enter your company email and we'll send instructions to reset your password.
        </p>

        <form id="forgotForm" novalidate>
          <div class="field" id="emailField">
            <label class="field__label" for="email">Company email</label>
            <div class="field__control">
              <i class="field__icon" data-lucide="mail" aria-hidden="true"></i>
              <input
                class="input has-icon"
                type="email"
                id="email"
                name="email"
                placeholder="you@company.com"
                autocomplete="username"
                aria-describedby="emailError"
              >
            </div>
            <p class="field__error" id="emailError" role="alert"></p>
          </div>

          <button type="submit" class="btn btn--primary btn--block" id="sendBtn">
            <span class="btn__label">Send reset link</span>
            <span class="btn__spinner" aria-hidden="true"></span>
          </button>
        </form>
      </div>

      <!-- Loading state -->
      <div class="auth-card__state" id="loadingState">
        <h1>Forgot your password?</h1>
        <div class="loading-state">
          <div class="loading-state__spinner" aria-hidden="true"></div>
          <p>Sending reset instructions&hellip;</p>
        </div>
      </div>

      <!-- Success state -->
      <div class="auth-card__state" id="successState">
        <div class="auth-card__success-icon">
          <i data-lucide="check" aria-hidden="true"></i>
        </div>
        <h1>Check your email</h1>
        <p class="auth-card__description">
          If an account exists with this email, password recovery instructions will be sent.
        </p>
        <a class="btn btn--secondary btn--block" href="login.html">Return to login</a>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/forgot-password.js"></script>
</body>
</html>
